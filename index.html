<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2B5F8A">
<title>Parte Diario B2Clean</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F4F2EB; --surface:#FFFFFF; --kraft:#EDE7D8; --ink:#16202B; --ink-soft:#5B6470; --line:#DAD3C0;
    --accent:#2B5F8A; --accent-soft:#DCE8F0; --gold:#C98A1F; --good:#2F8F5B; --good-soft:#E1F1E7; --bad:#B5432E; --bad-soft:#F5E1DB;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#11151A; --surface:#1A2027; --kraft:#222931; --ink:#ECE9E0; --ink-soft:#9BA5AE; --line:#333C46;
      --accent:#6FA6D6; --accent-soft:#1F3345; --gold:#E0AE4E; --good:#5CBE8A; --good-soft:#1B3027; --bad:#E08672; --bad-soft:#3A231E; }
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Segoe UI",Roboto,sans-serif; font-size:16px; line-height:1.4; padding-inline:16px; padding-block:16px 40px; }
  .wrap{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1{ margin:0; font-size:26px; letter-spacing:.01em; text-transform:uppercase; font-weight:800; }
  .sub{ color:var(--ink-soft); font-size:14px; margin-top:2px; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .sec{ font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); }
  label{ display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.04em; }
  .req{ color:var(--bad); }
  input, select, textarea{ width:100%; min-width:0; font:inherit; font-size:17px; color:var(--ink); background:var(--kraft); border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  input:focus, select:focus, textarea:focus{ outline:3px solid var(--gold); outline-offset:1px; }
  textarea{ min-height:80px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px; }
  .row3{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); gap:8px; }
  .row3 input[type="time"]{ font-size:15px; padding-inline:6px; }
  .serv{ background:var(--accent-soft); border-radius:10px; padding:10px 12px; font-size:14.5px; display:grid; grid-template-columns:auto 1fr; gap:3px 10px; }
  .serv b{ color:var(--ink-soft); font-weight:600; }
  .btn{ font:inherit; font-size:18px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; border:none; border-radius:12px; padding:15px; background:var(--accent); color:#fff; cursor:pointer; }
  .btn:active{ transform:translateY(1px); }
  .msg{ font-size:15px; font-weight:600; border-radius:10px; padding:10px 12px; }
  .msg.ok{ background:var(--good-soft); color:var(--good); }
  .msg.err{ background:var(--bad-soft); color:var(--bad); }
  .foot{ font-size:12px; color:var(--ink-soft); text-align:center; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>Parte diario</h1>
    <div class="sub">B2Clean · Llénalo al terminar el día y envíalo a la oficina.</div>
  </div>

  <form class="card" id="login" autocomplete="off" novalidate hidden>
    <div class="sec">Acceso B2Clean</div>
    <div><label for="clave">Clave <span class="req">*</span></label><input type="password" id="clave" autocomplete="current-password" autocapitalize="off" spellcheck="false"></div>
    <button class="btn" type="submit">Entrar</button>
    <div class="msg" id="msgLogin" hidden></div>
    <div class="foot">Pídele la clave a la oficina. Solo la escribes una vez en este celular.</div>
  </form>
  <div class="card" id="cargando">Cargando…</div>

  <form class="card" id="form" autocomplete="off" novalidate hidden>
    <div class="row2">
      <div><label for="grupo">Grupo <span class="req">*</span></label><select id="grupo"></select></div>
      <div><label for="fecha">Fecha <span class="req">*</span></label><input type="date" id="fecha"></div>
    </div>
    <div>
      <label for="servicio">Servicio <span class="req">*</span></label>
      <select id="servicio"></select>
    </div>
    <div class="serv" id="servInfo" hidden></div>

    <div class="sec">Horas</div>
    <div class="row3">
      <div><label for="llegada">Llegada</label><input type="time" id="llegada"></div>
      <div><label for="inicio">Inicio</label><input type="time" id="inicio"></div>
      <div><label for="fin">Fin</label><input type="time" id="fin"></div>
    </div>

    <div class="sec">Producción</div>
    <div class="row2">
      <div><label for="lavados">Paneles lavados <span class="req">*</span></label><input type="number" id="lavados" min="0" step="1" inputmode="numeric"></div>
      <div><label for="rotos">Paneles rotos</label><input type="number" id="rotos" min="0" step="1" inputmode="numeric"></div>
    </div>

    <div class="sec">Consumos</div>
    <div class="row3">
      <div><label for="agua">Agua m³</label><input type="number" id="agua" min="0" step="0.1" inputmode="decimal"></div>
      <div><label for="acpm">ACPM gl</label><input type="number" id="acpm" min="0" step="0.1" inputmode="decimal"></div>
      <div><label for="gasolina">Gasolina gl</label><input type="number" id="gasolina" min="0" step="0.1" inputmode="decimal"></div>
    </div>
    <div><label for="novedades">Novedades</label><textarea id="novedades" placeholder="Paneles rotos, daños, clima, falta de agua…"></textarea></div>

    <button class="btn" type="submit">Enviar parte</button>
    <div class="msg" id="msg" hidden></div>
  </form>

  <div class="foot" id="foot"></div>
  <div class="foot" id="salir" hidden><a href="#" id="btnSalir" style="color:inherit">Cambiar de clave</a></div>
</div>

<script>
(function(){
"use strict";
var SERVICIOS = [];
var GENERADO = "";
var KEY_LISTA = "b2clean_parte_web_lista";
var KEY_CLAVE = "b2clean_parte_web_clave";
var GRUPOS = ["Grupo 1","Grupo 2","Grupo 3","Grupo 4","Grupo 5","Grupo 6","Grupo 7"];
var KEY = "b2clean_parte_celular_grupo";

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function grp(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, "."); }
function hoy(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fTxt(f){ return f ? f.slice(8,10) + "/" + f.slice(5,7) : ""; }
function addDays(f, n){ var d = new Date(f + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
function slug(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, ""); }

$("grupo").innerHTML = '<option value="">Escoge tu grupo…</option>' + GRUPOS.map(function(g){ return '<option>' + g + '</option>'; }).join("");
$("fecha").value = hoy();
try{ var g0 = localStorage.getItem(KEY); if (g0) $("grupo").value = g0; }catch(e){}

function llenarServicios(){
  var g = $("grupo").value, f = $("fecha").value || hoy(), sel = $("servicio"), prev = sel.value;
  if (!g){ sel.innerHTML = '<option value="">Primero escoge el grupo</option>'; mostrarInfo(); return; }
  var del = SERVICIOS.filter(function(s){ return s.grupo === g; });
  var curso = del.filter(function(s){ return addDays(s.inicio, -3) <= f && f <= addDays(s.fin || s.inicio, 3); });
  var otros = del.filter(function(s){ return curso.indexOf(s) < 0; });
  function opt(s, i){ return '<option value="' + i + '">' + esc(s.nombre) + " (" + fTxt(s.inicio) + (s.fin && s.fin !== s.inicio ? " al " + fTxt(s.fin) : "") + ")</option>"; }
  var html = '<option value="">Escoge el servicio…</option>';
  if (curso.length) html += '<optgroup label="En estas fechas">' + curso.map(function(s){ return opt(s, SERVICIOS.indexOf(s)); }).join("") + "</optgroup>";
  if (otros.length) html += '<optgroup label="Otros servicios del grupo">' + otros.map(function(s){ return opt(s, SERVICIOS.indexOf(s)); }).join("") + "</optgroup>";
  if (!del.length) html = '<option value="">No hay servicios programados para este grupo. Avísale a la oficina.</option>';
  sel.innerHTML = html;
  if ([].some.call(sel.options, function(o){ return o.value === prev && prev !== ""; })) sel.value = prev;
  else if (curso.length === 1) sel.value = String(SERVICIOS.indexOf(curso[0]));
  mostrarInfo();
}
function mostrarInfo(){
  var s = SERVICIOS[$("servicio").value], box = $("servInfo");
  if (!s){ box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = "<b>Cliente</b><span>" + esc(s.cliente) + "</span><b>Proyecto</b><span>" + esc(s.proyecto) + "</span>" +
    (s.ciudad ? "<b>Ciudad</b><span>" + esc(s.ciudad) + "</span>" : "") +
    (s.paneles ? "<b>Paneles</b><span>" + grp(s.paneles) + "</span>" : "") +
    "<b>Fechas</b><span>" + fTxt(s.inicio) + (s.fin && s.fin !== s.inicio ? " al " + fTxt(s.fin) : "") + "</span>";
}
$("grupo").addEventListener("change", function(){ try{ localStorage.setItem(KEY, this.value); }catch(e){} llenarServicios(); });
$("fecha").addEventListener("change", llenarServicios);
$("servicio").addEventListener("change", mostrarInfo);

function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function descifrar(enc, clave){
  // Cada grupo tiene su bloque cifrado con su clave: se prueba la clave en todos y se abre el que corresponda.
  var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  var k = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(enc.salt), iterations:enc.it, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  for (var i = 0; i < enc.items.length; i++){
    try{
      var plano = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(enc.items[i].iv)}, k, b64(enc.items[i].data));
      return JSON.parse(new TextDecoder().decode(plano));
    }catch(e){}
  }
  throw new Error("clave");
}
function leerLS(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function guardarLS(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
var ENC = null, SIN_SENAL = false;
async function abrir(clave){
  var d = await descifrar(ENC, clave);
  guardarLS(KEY_CLAVE, clave);
  $("login").hidden = true; $("cargando").hidden = true; $("form").hidden = false; $("salir").hidden = false;
  var sel = $("grupo");
  if (d.grupo){
    sel.innerHTML = "<option>" + esc(d.grupo) + "</option>"; sel.value = d.grupo; sel.disabled = true;
  } else {
    sel.disabled = false;
    sel.innerHTML = '<option value="">Escoge el grupo…</option>' + GRUPOS.map(function(g){ return "<option>" + g + "</option>"; }).join("");
    var g0 = leerLS(KEY); if (g0) sel.value = g0;
  }
  usarLista(d, SIN_SENAL);
}
function pedirClave(t){
  $("cargando").hidden = true; $("form").hidden = true; $("login").hidden = false;
  if (t){ var m = $("msgLogin"); m.hidden = false; m.textContent = t; m.className = "msg err"; }
}
$("btnSalir").addEventListener("click", function(e){
  e.preventDefault();
  if (!confirm("¿Borrar la clave de este celular? Tendrás que escribirla de nuevo.")) return;
  try{ localStorage.removeItem(KEY_CLAVE); }catch(err){}
  $("clave").value = ""; $("msgLogin").hidden = true; $("salir").hidden = true; pedirClave("");
});
$("login").addEventListener("submit", function(e){
  e.preventDefault();
  var c = $("clave").value;
  if (!c.trim()){ pedirClave("Escribe la clave."); return; }
  abrir(c).catch(function(){ pedirClave("Clave incorrecta. Revísala con la oficina."); });
});
async function iniciar(enc){
  ENC = enc;
  var c = leerLS(KEY_CLAVE);
  if (!c){ pedirClave(""); return; }
  try{ await abrir(c); }
  catch(e){ pedirClave("La clave cambió. Pídele la nueva a la oficina."); }
}

function usarLista(d, guardada){
  SERVICIOS = d.servicios || []; GENERADO = d.generado || "";
  $("foot").textContent = "Lista de servicios del Panel de Control al " + GENERADO + (guardada ? " (sin señal: última lista guardada)." : ".");
  llenarServicios();
}
if (!window.crypto || !crypto.subtle){ $("cargando").textContent = "Este navegador no sirve. Abre el enlace en Chrome."; }
else fetch("servicios.json?t=" + Date.now(), {cache:"no-store"})
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(enc){ guardarLS(KEY_LISTA, JSON.stringify(enc)); iniciar(enc); })
  .catch(function(){
    var enc = null; try{ enc = JSON.parse(leerLS(KEY_LISTA)); }catch(e){}
    SIN_SENAL = true;
    if (enc) iniciar(enc);
    else $("cargando").textContent = "Sin señal: no se pudo cargar la lista de servicios. Busca señal y recarga la página.";
  });

function aviso(t, ok){ var m = $("msg"); m.hidden = false; m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); m.scrollIntoView({behavior:"smooth", block:"center"}); }
function serial(f){ var p = f.split("-"); return (Date.UTC(+p[0], +p[1]-1, +p[2]) - Date.UTC(1899, 11, 30)) / 86400000; }

$("form").addEventListener("submit", async function(e){
  e.preventDefault();
  var g = $("grupo").value, f = $("fecha").value, s = SERVICIOS[$("servicio").value];
  if (!g){ aviso("Falta escoger el grupo.", false); return; }
  if (!f){ aviso("Falta la fecha.", false); return; }
  if (!s){ aviso("Falta escoger el servicio.", false); return; }
  if ($("lavados").value === ""){ aviso("Escribe cuántos paneles lavaron (0 si no se lavó).", false); return; }
  if (typeof XLSX === "undefined"){ aviso("No hay internet para generar el archivo. Busca señal y vuelve a darle Enviar (lo que escribiste no se borra).", false); return; }
  var id = slug(g) + "_" + f + "_" + slug(s.codigo || s.nombre);
  var H = ["ID","Fecha","Grupo","Código servicio","Cliente","Proyecto","Ciudad","Hora llegada","Hora inicio","Hora fin","Paneles lavados","Paneles rotos","Agua m3","ACPM gl","Gasolina gl","Novedades"];
  var fila = [id, serial(f), g, s.codigo, s.cliente, s.proyecto, s.ciudad, $("llegada").value, $("inicio").value, $("fin").value,
              num($("lavados").value), num($("rotos").value), num($("agua").value), num($("acpm").value), num($("gasolina").value), $("novedades").value.trim()];
  var ws = XLSX.utils.aoa_to_sheet([H, fila]); ws["B2"].z = "dd/mm/yyyy";
  ws["!cols"] = H.map(function(h){ return {wch: Math.max(10, h.length + 2)}; });
  var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Parte");
  var buf = XLSX.write(wb, {bookType:"xlsx", type:"array"});
  var nombre = "Parte " + g + " " + f + ".xlsx";
  var file = null;
  try{ file = new File([buf], nombre, {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}); }catch(err){}
  if (file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:nombre, text:"Parte diario " + g + " " + f}); aviso("Listo. Si lo mandaste a la oficina por WhatsApp, ya quedó.", true); return; }
    catch(err){ if (err && err.name === "AbortError") { aviso("No se envió. Dale otra vez a Enviar parte cuando quieras.", false); return; } }
  }
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([buf], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  aviso("Se descargó el archivo \"" + nombre + "\". Envíalo a la oficina por WhatsApp (adjuntar → Documento).", true);
});
})();
</script>
</body>
</html>
